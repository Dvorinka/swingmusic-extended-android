name: Swing Music CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 34
        build-tools: 34.0.0
        ndk: 25.1.8937393
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      
    - name: Clean build
      run: ./gradlew clean
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug
      
    - name: Build Release APK
      run: ./gradlew assembleRelease
      
    - name: Verify APK exists
      run: |
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          echo "✅ Release APK built successfully"
          ls -la app/build/outputs/apk/release/
        else
          echo "❌ Release APK build failed"
          find app/build/outputs -name "*.apk" -ls
          exit 1
        fi
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 90
        
    - name: Generate QR Code
      if: success()
      uses: snow-actions/qrcode@v1.2.0
      with:
        text: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/release-apk/app-release.apk
        path: swing-music-qr.png
        
    - name: Upload QR Code
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: qr-code
        path: swing-music-qr.png
        retention-days: 90
        
    - name: Create Release
      if: github.ref == 'refs/heads/main' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
        generate_release_notes: true
        name: Swing Music v${{ github.run_number }}
        body: |
          ## 🎵 Swing Music Android App
          
          ### 📱 Installation
          1. **Download APK** from the assets below
          2. **Scan QR Code** for easy installation
          
          ### ✨ What's New
          - **Enhanced lyrics system** with word-by-word animations
          - **New dashboard** with quick actions and statistics  
          - **Waveform visualizations** (bar, circular, minimal)
          - **Comprehensive settings** and user preferences
          - **Improved library organization** with albums, playlists, favorites
          - **Real-time analytics** and listening stats
          - **Playlist to artist linking** for better discovery
          - **Home screen widgets** for quick access
          - **Enhanced UI** matching web design
          - **Fixed reactivity** and toolbar issues
          
          ### 🔧 Features
          - **Advanced lyrics** with animations and word highlighting
          - **Waveform visualizations** with real-time data
          - **User settings** with comprehensive preferences
          - **Dashboard** with statistics and quick actions
          - **Library** with albums, playlists, favorites, folders, artists
          - **Analytics** with listening stats and tracking
          - **Widgets** for home screen integration
          - **Playlist-artist linking** for enhanced discovery
          - **Material Design 3** with consistent theming
          
          ### 🚀 Improvements
          - Fixed app reactivity and toolbar overlap issues
          - Enhanced navigation and user experience
          - Optimized performance and memory usage
          - Improved error handling and loading states
          - Better integration with system features
          
          ---
          **📲 QR Code for easy installation is attached to this release!**
          
          ### 🔗 Links
          - **GitHub Repository**: ${{ github.repository }}
          - **Issues**: ${{ github.server_url }}/${{ github.repository }}/issues
