name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - 'swingmusic-android/**'
  pull_request:
    branches:
      - main
    paths:
      - 'swingmusic-android/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('swingmusic-android/**/*.gradle*', 'swingmusic-android/**/*.gradle.kts') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Change to Android directory
      run: cd swingmusic-android
      
    - name: Grant execute permission for gradlew
      run: chmod +x ./swingmusic-android/gradlew
      
    - name: Run unit tests
      run: cd swingmusic-android && ./gradlew test
      
    - name: Run lint
      run: cd swingmusic-android && ./gradlew lint

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('swingmusic-android/**/*.gradle*', 'swingmusic-android/**/*.gradle.kts') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x ./swingmusic-android/gradlew
      
    - name: Build Debug APK
      run: cd swingmusic-android && ./gradlew assembleDebug
      
    - name: Build Release APK (with debug keystore)
      run: cd swingmusic-android && ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android
      
    - name: Verify APK exists
      run: |
        if [ -f "swingmusic-android/app/build/outputs/apk/release/app-release.apk" ]; then
          echo "✅ Release APK built successfully"
          ls -la swingmusic-android/app/build/outputs/apk/release/
        else
          echo "❌ Release APK build failed"
          find swingmusic-android/app/build/outputs -name "*.apk" -ls
          exit 1
        fi
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: swingmusic-android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: swingmusic-android/app/build/outputs/apk/release/app-release.apk
        retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: release-apk
        path: ./artifacts/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./artifacts/app-release.apk
        draft: false
        prerelease: false
        generate_release_notes: true
        name: Swing Music Android v${{ github.run_number }}
        body: |
          ## 🎵 Swing Music Android App
          
          ### 📱 Installation
          Download the APK from the assets below and install on your Android device.
          
          ### 🔧 Features
          - **Advanced lyrics** with animations and word highlighting
          - **Waveform visualizations** with real-time data
          - **User settings** with comprehensive preferences
          - **Dashboard** with statistics and quick actions
          - **Library** with albums, playlists, favorites, folders, artists
          - **Analytics** with listening stats and tracking
          - **Widgets** for home screen integration
          - **Material Design 3** with consistent theming
          
          ---
          ### 🔗 Links
          - **GitHub Repository**: ${{ github.repository }}
          - **Issues**: ${{ github.server_url }}/${{ github.repository }}/issues
